openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DevTerminal API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: execute
    description: Code execution
  - name: snippets
    description: Code snippets management
  - name: ai
    description: AI assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /execute:
    post:
      operationId: executeCode
      tags: [execute]
      summary: Execute code in a given language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResult"

  /languages:
    get:
      operationId: getLanguages
      tags: [execute]
      summary: Get supported languages
      responses:
        "200":
          description: List of supported languages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageList"

  /snippets:
    get:
      operationId: listSnippets
      tags: [snippets]
      summary: List all saved snippets
      responses:
        "200":
          description: List of snippets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snippet"
    post:
      operationId: createSnippet
      tags: [snippets]
      summary: Save a new code snippet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnippetBody"
      responses:
        "201":
          description: Created snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snippet"

  /snippets/recent:
    get:
      operationId: getRecentSnippets
      tags: [snippets]
      summary: Get the 5 most recently used snippets
      responses:
        "200":
          description: Recent snippets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snippet"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /deepseek/chat:
    post:
      operationId: deepseekChat
      tags: [ai]
      summary: Consultar DeepSeek con respuesta en streaming SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeepSeekChatInput"
      responses:
        "200":
          description: Flujo SSE con fragmentos de respuesta
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Solicitud inválida
        "503":
          description: Falta configurar OPENAI_API_KEY
        "502":
          description: Error al consultar DeepSeek

  /chat:
    post:
      operationId: deepseekChatAlias
      tags: [ai]
      summary: Alias SSE de chat SQ-AI con contexto PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeepSeekChatInput"
      responses:
        "200":
          description: Flujo SSE con fragmentos de respuesta
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Solicitud inválida
        "503":
          description: Falta configurar OPENAI_API_KEY
        "502":
          description: Error al consultar DeepSeek

  /ai/explain:
    post:
      operationId: aiExplain
      tags: [ai]
      summary: Explain code using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExplainRequest"
      responses:
        "200":
          description: AI explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCodeResponse"

  /ai/improve:
    post:
      operationId: aiImprove
      tags: [ai]
      summary: Improve or fix code using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImproveRequest"
      responses:
        "200":
          description: AI improved code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCodeResponse"

  /snippets/{id}:
    get:
      operationId: getSnippet
      tags: [snippets]
      summary: Get a snippet by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snippet"
        "404":
          description: Not found
    put:
      operationId: updateSnippet
      tags: [snippets]
      summary: Update a snippet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSnippetBody"
      responses:
        "200":
          description: Updated snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snippet"
    delete:
      operationId: deleteSnippet
      tags: [snippets]
      summary: Delete a snippet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ExecuteRequest:
      type: object
      properties:
        language:
          type: string
          enum: [javascript, python, bash, typescript]
        code:
          type: string
        stdin:
          type: string
      required:
        - language
        - code

    ExecuteResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
        executionTime:
          type: number
      required:
        - stdout
        - stderr
        - exitCode
        - executionTime

    Language:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        extension:
          type: string
        monacoLanguage:
          type: string
      required:
        - id
        - name
        - extension
        - monacoLanguage

    LanguageList:
      type: object
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
      required:
        - languages

    Snippet:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        code:
          type: string
        language:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        lastRunAt:
          type: string
          nullable: true
      required:
        - id
        - title
        - code
        - language
        - createdAt
        - updatedAt

    CreateSnippetBody:
      type: object
      properties:
        title:
          type: string
        code:
          type: string
        language:
          type: string
      required:
        - title
        - code
        - language

    UpdateSnippetBody:
      type: object
      properties:
        title:
          type: string
        code:
          type: string
        language:
          type: string

    AiMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      required:
        - role
        - content

    AiChatRequest:
      type: object
      properties:
        message:
          type: string
        context:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
      required:
        - message

    AiChatResponse:
      type: object
      properties:
        response:
          type: string
        conversationId:
          type: integer
      required:
        - response
        - conversationId

    DeepSeekChatInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
        context:
          type: ["string", "null"]
          maxLength: 30000
      required:
        - prompt

    AiExplainRequest:
      type: object
      properties:
        code:
          type: string
        language:
          type: string
        output:
          type: string
          nullable: true
      required:
        - code
        - language

    AiImproveRequest:
      type: object
      properties:
        code:
          type: string
        language:
          type: string
        instruction:
          type: string
          nullable: true
      required:
        - code
        - language

    AiCodeResponse:
      type: object
      properties:
        result:
          type: string
      required:
        - result
