name: OMEGA 4105 validation

on:
  pull_request:
  push:
    branches:
      - fix/omega4105-lite-windows-supervisor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Refresh lockfile for Windows x64 dependencies
        if: matrix.os == 'windows-latest'
        run: pnpm install --no-frozen-lockfile
      - name: Commit only regenerated lockfile
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm lockfile for Windows native dependencies"
            git push origin HEAD:fix/omega4105-lite-windows-supervisor
          fi
      - name: Install dependencies (frozen lockfile)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm -r --if-present run build
