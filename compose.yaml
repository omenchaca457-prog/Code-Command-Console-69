services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devterminal
      POSTGRES_PASSWORD: devterminal_local
      POSTGRES_DB: devterminal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devterminal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devterminal -d devterminal"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  devterminal_data:
